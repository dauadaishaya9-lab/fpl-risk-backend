services:
  - type: web
    name: fpl-risk-backend
    runtime: node
    buildCommand: npm install
    startCommand: node security-proxy-v3.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
